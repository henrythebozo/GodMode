<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>GodMode Screen Answers</title>
		<style>
			body {
				width: 280px;
				margin: 0;
				padding: 14px;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				background: #111827;
				color: #f3f4f6;
			}
			h1 {
				font-size: 14px;
				margin: 0 0 4px;
				color: #a5b4fc;
			}
			p {
				font-size: 12px;
				color: #9ca3af;
				margin: 0 0 12px;
				line-height: 1.4;
			}
			.shortcut {
				display: inline-block;
				background: #1f2937;
				border: 1px solid rgba(255, 255, 255, 0.12);
				border-radius: 5px;
				padding: 1px 6px;
				font-family: monospace;
				font-size: 11px;
				color: #f3f4f6;
			}
			input {
				width: 100%;
				box-sizing: border-box;
				background: #1f2937;
				border: 1px solid rgba(255, 255, 255, 0.12);
				border-radius: 6px;
				color: #f3f4f6;
				padding: 7px 8px;
				font-size: 12px;
				margin-bottom: 8px;
			}
			button {
				width: 100%;
				background: #4f46e5;
				border: none;
				color: white;
				border-radius: 6px;
				padding: 8px;
				font-size: 12px;
				font-weight: 600;
				cursor: pointer;
			}
			button:hover {
				background: #4338ca;
			}
			.link {
				display: block;
				text-align: center;
				margin-top: 10px;
				font-size: 11px;
				color: #9ca3af;
				cursor: pointer;
			}
			.link:hover {
				color: #a5b4fc;
			}
			#status {
				font-size: 11px;
				color: #9ca3af;
				margin-top: 8px;
				min-height: 14px;
			}
			#needsKey {
				display: none;
				font-size: 11px;
				color: #fca5a5;
				margin-bottom: 8px;
			}
		</style>
	</head>
	<body>
		<h1>GodMode Screen Answers</h1>
		<p>
			Press <span class="shortcut" id="shortcutLabel">Ctrl+Shift+Y</span> on
			any page to screenshot it and ask Claude. Or ask something specific
			below.
		</p>
		<div id="needsKey">No API key set yet — add one in Options first.</div>
		<input type="text" id="question" placeholder="Optional: what to ask about the screen" />
		<button id="capture">Capture &amp; Ask</button>
		<div id="status"></div>
		<span class="link" id="openOptions">Options (API key, model)</span>
		<script src="popup.js"></script>
	</body>
</html>
