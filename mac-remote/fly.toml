# Fly.io config for the Mac Remote relay.
#   brew install flyctl && fly auth signup
#   fly launch --copy-config --no-deploy --name <pick-a-name> --region <nearest, e.g. lax/ord/lhr>
#   fly secrets set RELAY_SECRET="$(openssl rand -base64 24)"
#   fly deploy
app = "mac-remote-relay"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  TRUST_PROXY = "fly"

[http_service]
  internal_port = 8080
  force_https = true
  # The Mac keeps a WebSocket open to the relay; never stop the machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/relay/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
